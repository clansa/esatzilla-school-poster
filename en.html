<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e14;
    --bg-glow: #10141c;
    --surface: #12161f;
    --surface-hover: #171c27;
    --border: #232935;
    --border-hover: #3a4152;
    --text: #f2efe9;
    --text-muted: #8a93a3;
    --accent: #d8a64b;
  }

  *{ box-sizing: border-box; }

  html{
    scroll-behavior: smooth;
    overflow-x: hidden;
    width: 100%;
  }

  body{
    margin: 0;
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 18% -10%, var(--bg-glow) 0%, transparent 45%),
      radial-gradient(circle at 85% 110%, #141a26 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(20px, 5vw, 48px) clamp(16px, 6vw, 64px) clamp(20px, 3vw, 40px);
  }

  main{
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    animation: rise 0.9s cubic-bezier(.2,.8,.25,1) both;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .topbar{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .back{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.01em;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px 8px 12px;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .back:hover, .back:focus-visible{
    color: var(--text);
    border-color: var(--border-hover);
    background: var(--surface);
  }

  .back svg{ width: 16px; height: 16px; flex-shrink: 0; }

  .flag-chip{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--border-hover);
    flex-shrink: 0;
  }

  .flag-chip img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .poster-frame{
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 24px 48px -28px rgba(0,0,0,0.75);
  }

  .poster-frame img{
    width: 100%;
    height: auto;
    display: block;
  }

  footer{
    margin-top: 40px;
    padding-top: 22px;
    width: 100%;
    max-width: 640px;
    display: flex;
    justify-content: center;
    border-top: 1px solid var(--border);
  }

  footer p{
    margin: 22px 0 0;
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    text-align: center;
  }

  @media (max-width: 420px){
    .back span{ display: none; }
    .back{ padding: 8px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main>
  <div class="topbar">
    <a class="back" href="index.html" aria-label="Back to language selection">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Language selection</span>
    </a>
    <div class="flag-chip">
      <img src="https://flagcdn.com/w80/gb.png" alt="British flag">
    </div>
  </div>

  <div class="poster-frame">
    <img src="en.webp" alt="Need help? Welcome to ISK / Come learn — information poster with contact person, hygiene rules, classroom etiquette and QR code for language translations">
  </div>
</main>

<footer>
  <p>This website made by Esatzilla</p>
</footer>

</body>
</html>
